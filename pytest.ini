[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:faulthandler -n auto --dist=loadgroup
markers =
    slow: tests that are slow and excluded from fast CI gates
    gpu: tests that require GPU acceleration
    network: tests that require network/download access
    e2e: end-to-end tests
    exclusive: tests that must not run concurrently with other exclusive tests
