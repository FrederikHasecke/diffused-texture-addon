name: build
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (optional; defaults to the caller ref)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (optional; defaults to the current ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine version (for filename)
        shell: bash
        run: |
          REL_VER="$(python3 -c 'import tomllib;print(tomllib.load(open("blender_manifest.toml","rb"))["version"].strip())')"
          echo "REL_VER=$REL_VER" >> $GITHUB_ENV

      - name: Stage clean build dir
        run: |
          rm -rf dist/addon && mkdir -p dist/addon
          rsync -a --delete \
            --exclude='.*' --exclude='__pycache__/' \
            --exclude='.vscode/' --exclude='.ruff_cache/' --exclude='.pytest_cache/' \
            --exclude='documentation/' --exclude='tests/' --exclude='images/' \
            --exclude='scratchbook/' --exclude='*.md' --exclude='Dockerfile' --exclude='requirements*.txt' \
            --exclude='wheels*/' --exclude='scripts/' \
            --exclude='pyproject.toml' --exclude='pytest.ini' --exclude='uv.lock' \
            --exclude='release-please-config.json' --exclude='.release-please-manifest.json' \
            ./ dist/addon/

      - name: Create addon zip
        run: |
          cd dist/addon
          zip -r ../diffused_texture_addon-${{ env.REL_VER }}.zip *

      - name: Build addon
        uses: blenderkit/blender-addon-build@main
        with:
          name: diffusedtexture-addon
          do-checkout: 'false'
          build-location: 'dist/addon'
          exclude-files: ".git"

      - name: Upload artifact (stable name)
        uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/diffused_texture_addon-${{ env.REL_VER }}.zip
          if-no-files-found: error
