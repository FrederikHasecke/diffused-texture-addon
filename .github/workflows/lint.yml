name: lint
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: check . --output-format=github --config pyproject.toml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux system libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y libice6 libsm6
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.3" "pytest-xdist>=3.6.1" "bpy==5.2.0" "pillow==12.3.0" "dotenv>=0.9.9" "opencv-python-headless>=5.0.0.93"
      - name: Run fast CI test gates
        run: |
          python -m pytest \
            tests/unit_tests \
            tests/integration_tests \
            -m "not slow and not gpu and not network and not e2e" \
            -q

      - name: Run lightweight installer contract tests
        run: |
          python -m pytest \
            tests/unit_tests/test_runtime_matrix.py \
            -q
