name: lint
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: check . --output-format=github --config pyproject.toml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.2" "pytest-xdist>=3.6.1" "bpy>=5.1.0" "pillow==12.0.0"
      - name: Run fast CI test gates
        run: |
          python -m pytest \
            tests/unit_tests \
            tests/integration_tests \
            -m "not slow and not gpu and not network and not e2e" \
            -q

      - name: Run installer matrix tests
        run: |
          python -m pytest \
            tests/unit_tests/test_runtime_matrix.py \
            tests/install_tests/test_pip_resolution.py \
            -q
